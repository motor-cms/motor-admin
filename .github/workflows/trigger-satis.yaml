name: Trigger satis build

on:
  workflow_dispatch:
  push:
    tags:
      - '**'           # Push events to every tag including hierarchical tags like v1.0/beta
    branches:
      - main
      - "2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke build hook for satis
        uses: zzzze/webhook-trigger@master
        with:
          data: "{\"package\":\"motor-cms/motor-builder\"}"
          webhook_url: ${{ secrets.SATIS_WEBHOOK_URL }}
          options: "--user ${{ secrets.USERNAME }}:${{ secrets.PASSWORD }}"
